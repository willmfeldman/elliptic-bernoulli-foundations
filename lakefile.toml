name = "elliptic_bernoulli_foundations"
version = "0.2.0"
description = "Foundations of the elliptic one-phase Bernoulli free boundary problem (variable coefficient)"
keywords = ["math"]
defaultTargets = ["EllipticBernoulli"]
preferReleaseBuild = true

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[require]]
name = "viscosity_solns"
git = "https://github.com/willmfeldman/viscosity-solution-theory"
rev = "v0.3.0"

[[lean_lib]]
name = "EllipticBernoulli"

[[lean_lib]]
name = "EllipticBernoulliComparator"
roots = ["EllipticBernoulli.Comparator"]
