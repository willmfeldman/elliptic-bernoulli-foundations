# Theorem manifest for EllipticBernoulli, modeled on the theorem-manifest conventions used by public
# Lean formalization repositories. CI (scripts/check-formalization-manifest.rb) checks that every
# listed Lean name resolves, that each target depends on exactly axioms.expected, and that the
# challenge inventory below matches challenges/*/config.json; CI also elaborates the external
# challenge workspaces. Statement equality between challenges and solutions is checked only by
# the release comparator workflow.
schema_version: "1"
project:
  name: "EllipticBernoulli"
  title: "elliptic-bernoulli-foundations: the elliptic one-phase Bernoulli free boundary problem in Lean"
  authors:
    - "William M. Feldman"
  repository: "https://github.com/willmfeldman/elliptic-bernoulli-foundations"
  license: "Apache-2.0"
  language: "Lean"
  theorem_prover: "Lean 4"
  lean_toolchain: "leanprover/lean4:v4.34.1"
  mathlib: "v4.34.1"
  description: >-
    Lean 4 formalization of foundational results for the elliptic one-phase
    Bernoulli free boundary problem Δu = 0 in {u > 0}, |∇u| = Q on ∂{u > 0},
    with a variable coefficient 0 < Qmin ≤ Q ≤ Qmax: obstacle problems for the
    Alt–Caffarelli energy, energy perturbations, the Lipschitz estimate,
    non-degeneracy, De Silva's flatness theory, classical solutions, and the
    classification of planar 1-homogeneous inner variational solutions.

dependencies:
  - name: "mathlib"
    url: "https://github.com/leanprover-community/mathlib4"
    rev: "d13f23b723b8a846827a245b89c10fc7d3f11612"
  - name: "viscosity_solns"
    url: "https://github.com/willmfeldman/viscosity-solution-theory"
    rev: "067e2540ad1594408c0b6145c5bde01b4d5791a9"
  - name: "AleksandrovDifferentiability"
    url: "https://github.com/willmfeldman/aleksandrov-differentiability"
    rev: "6b318246f170ac472de4728e22f95a2adae420a5"

build:
  package_file: "lakefile.toml"
  manifest_file: "lake-manifest.json"
  root_import: "EllipticBernoulli"
  comparator_target: "EllipticBernoulliComparator"
  commands:
    - "lake exe cache get"
    - "lake build"

axioms:
  expected:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"

automation:
  methods:
    - method: "agent-assisted formalization"
      models:
        - "Claude (Anthropic)"
      framework: "Claude Code agentic coding workflow"
      review_status: "human-supervised"
      notes: >-
        The Lean proofs were written by AI coding agents (Claude) under the author's mathematical
        direction and review. The theorem statements and proof routes were reviewed by the author.
        Correctness rests on Lean's kernel check, together with the comparator challenges in
        challenges/.
targets:
  - id: obstacle-existence
    kind: headline-theorem
    expected_axioms: [propext, Quot.sound, Classical.choice]
    title: Existence and continuity for the obstacle problem
    source: "F. Abedin, W. M. Feldman, K. Stinson, Variational properties of Perron's extremal solutions in the Bernoulli one-phase problem, arXiv:2609.14981, proof of Lemma 6.3 (direct method; the interior continuity argument is new)"
    module: EllipticBernoulli.Variational.Continuity
    declaration: EllipticBernoulli.IsObstacleMinimizer.exists_continuousOn
    related_declarations:
      - EllipticBernoulli.exists_isObstacleMinimizer
    informal: >
      Minimizers of the Alt–Caffarelli energy J_Q(v; B) = ∫_B |∇v|² + Q² 1_{v>0}
      under a closed pointwise constraint and a boundary condition off a ball B
      exist when Q is bounded and measurable and u ∈ H¹_loc; for the
      constraints 0 ≤ v ≤ u and u ≤ v, with Q Lipschitz and bounded between
      positive constants and u ≥ 0 locally Lipschitz, every minimizer has a
      representative continuous on the whole domain.
    challenge: challenges/obstacle-existence
    challenge_theorems:
      - EllipticBernoulli.challenge_exists_isObstacleMinimizer
      - EllipticBernoulli.challenge_isObstacleMinimizer_exists_continuousOn
  - id: energy-perturbation
    kind: headline-theorem
    expected_axioms: [propext, Quot.sound, Classical.choice]
    title: Energy-decreasing perturbations (the proof of Feldman–Kim–Požár Lemma 3.3)
    source: "W. M. Feldman, I. C. Kim, N. Požár, On the geometry of rate-independent droplet evolution, Calc. Var. Partial Differential Equations 65 (2026), no. 10, Paper No. 265; arXiv:2310.03656 (numbering of v2), the perturbation step in the proof of Lemma 3.3, and Lemma A.1"
    module: EllipticBernoulli.Variational.Perturbation
    declaration: EllipticBernoulli.energy_decrease_of_not_super
    related_declarations:
      - EllipticBernoulli.energy_decrease_of_not_sub
    informal: >
      Let Q be Lipschitz with 0 < c ≤ Q ≤ C, and let w ≥ 0 be continuous and
      in H¹_loc. If a smooth function touching w strictly from below (above)
      fails the supersolution (subsolution) test of the one-phase problem, a
      local perturbation of w strictly decreases the Alt–Caffarelli energy.
      This is the key step of the proof of Feldman–Kim–Požár Lemma 3.3; the
      lemma itself (minimizers are viscosity solutions) is the target
      viscosity-minimizers.
    challenge: challenges/energy-perturbation
    challenge_theorems:
      - EllipticBernoulli.challenge_energy_decrease_of_not_super
      - EllipticBernoulli.challenge_energy_decrease_of_not_sub
  - id: viscosity-minimizers
    kind: headline-theorem
    expected_axioms: [propext, Quot.sound, Classical.choice]
    title: Minimizers are viscosity solutions
    source: "W. M. Feldman, I. C. Kim, N. Požár, On the geometry of rate-independent droplet evolution, Calc. Var. Partial Differential Equations 65 (2026), no. 10, Paper No. 265; arXiv:2310.03656 (numbering of v2), Lemma 3.3; B. Velichkov, Regularity of the One-phase Free Boundaries, Lecture Notes of the Unione Matematica Italiana 28, Springer, 2023, Proposition 7.1; F. Abedin, W. M. Feldman, K. Stinson, Variational properties of Perron's extremal solutions in the Bernoulli one-phase problem, arXiv:2609.14981, Lemma 6.3, Steps 1–2"
    module: EllipticBernoulli.Variational.OneSided
    declaration: EllipticBernoulli.IsLocalEnergyMinimizer.isViscSolution
    related_declarations:
      - EllipticBernoulli.IsUpwardMinimizer.isViscSuper
      - EllipticBernoulli.IsDownwardMinimizer.isViscSub
      - EllipticBernoulli.IsObstacleMinimizer.isViscSuper_of_upper
      - EllipticBernoulli.IsObstacleMinimizer.isViscSub_of_lower
    informal: >
      For continuous Q ≥ 0 and continuous u ≥ 0, upward minimizers of the
      Alt–Caffarelli energy are viscosity supersolutions, downward minimizers
      are viscosity subsolutions, and local energy minimizers are viscosity
      solutions (for the subsolution case Q ≥ 0 is not needed). For Q
      Lipschitz with 0 < c ≤ Q ≤ C, a continuous minimizer of J_Q(·; B_r(x₀))
      under the constraint 0 ≤ w ≤ u below a viscosity supersolution u is a
      supersolution, and a continuous minimizer under u ≤ w above a viscosity
      subsolution u is a subsolution.
    challenge: challenges/viscosity-minimizers
    challenge_theorems:
      - EllipticBernoulli.challenge_isUpwardMinimizer_isViscSuper
      - EllipticBernoulli.challenge_isDownwardMinimizer_isViscSub
      - EllipticBernoulli.challenge_isLocalEnergyMinimizer_isViscSolution
      - EllipticBernoulli.challenge_isObstacleMinimizer_isViscSuper_of_upper
      - EllipticBernoulli.challenge_isObstacleMinimizer_isViscSub_of_lower
  - id: lipschitz-estimate
    kind: headline-theorem
    expected_axioms: [propext, Quot.sound, Classical.choice]
    title: Lipschitz estimate for viscosity supersolutions
    source: "L. A. Caffarelli, S. Salsa, A Geometric Approach to Free Boundary Problems, Grad. Stud. Math. 68, Amer. Math. Soc., 2005, Lemma 11.19"
    module: EllipticBernoulli.Lipschitz.Estimate
    declaration: EllipticBernoulli.lipschitzOnWith_of_isViscSuper
    related_declarations:
      - EllipticBernoulli.locallyLipschitzOn_of_isViscSuper
    informal: >
      A viscosity supersolution which is harmonic in its positivity set is
      Lipschitz on B_r(x₀) with constant C (Qmax + M / r), where Q ≤ Qmax and
      u ≤ M on B_{2r}(x₀), and C = C(d) depends only on the dimension; hence
      locally Lipschitz for continuous Q.
    challenge: challenges/lipschitz-estimate
    challenge_theorems:
      - EllipticBernoulli.challenge_lipschitzOnWith_of_isViscSuper
      - EllipticBernoulli.challenge_locallyLipschitzOn_of_isViscSuper
  - id: nondegeneracy
    kind: headline-theorem
    expected_axioms: [propext, Quot.sound, Classical.choice]
    title: Non-degeneracy, with constants depending only on the data
    source: "L. A. Caffarelli, S. Salsa, A Geometric Approach to Free Boundary Problems, Grad. Stud. Math. 68, Amer. Math. Soc., 2005, Lemma 6.9; F. Abedin, W. M. Feldman, K. Stinson, Variational properties of Perron's extremal solutions in the Bernoulli one-phase problem, arXiv:2609.14981, Lemmas B.2, B.3 and Theorem B.1 (after B. Orcan-Ekmekci, On the geometry and regularity of largest subsolutions for a free boundary problem in ℝ²: elliptic case, Calc. Var. Partial Differential Equations 49 (2014), no. 3–4, 937–962); H. W. Alt, L. A. Caffarelli, Existence and regularity for a minimum problem with free boundary, J. Reine Angew. Math. 325 (1981), 105–144, Lemma 3.4"
    module: EllipticBernoulli.Nondegeneracy.SmallestSuper
    declaration: EllipticBernoulli.IsLocalSmallestSuper.exists_le_of_closedBall_subset
    related_declarations:
      - EllipticBernoulli.exists_le_of_exteriorBall_sameRadius
      - EllipticBernoulli.nondegenerate_sup_iff_average
      - EllipticBernoulli.IsDownwardMinimizer.exists_le_of_closedBall_subset
      - EllipticBernoulli.exists_pos_le_of_isLocalLargestSub
      - EllipticBernoulli.IsLocalSmallestSuper.isUniformlyNondegenerateNear
      - EllipticBernoulli.exists_le_of_exteriorBall
      - EllipticBernoulli.IsDownwardMinimizer.isUniformlyNondegenerateNear
      - EllipticBernoulli.isNondegenerateAt_of_isLocalLargestSub
    informal: >
      With Q ≥ q₀ > 0, every constant below depends only on the data, not on
      the solution. A local smallest supersolution satisfies
      sup_{B̄_r(z)} u ≥ q₀ r / (8d) for every z in the closure of {u > 0} and
      every closed ball B̄_r(z) in the domain (Caffarelli–Salsa Lemma 6.9); a
      locally Lipschitz downward minimizer u ≥ 0 with Q bounded and measurable
      satisfies the same with q₀ r / (8d e^{d/2}) (Alt–Caffarelli Lemma 3.4).
      A subsolution in B_s(x₀) with an exterior ball of the same radius
      touching the free boundary at x₀ satisfies
      sup_{B_s(x₀)} v ≥ q₀ s / (128 d e^{3d}) (Abedin–Feldman–Stinson
      Lemma B.2). The sphere-average and sphere-sup forms of non-degeneracy
      are equivalent for Lipschitz functions harmonic in {u > 0} (Lemma B.3 (i)⇔(ii)).
      In d = 2, a local largest subsolution in B_R(x₀) which is K-Lipschitz,
      C² and harmonic in {u > 0} (hypotheses Abedin–Feldman–Stinson do not state)
      satisfies sup_{B̄_r(x₀)} u ≥ c r for r ≤ R/2 at a free boundary point
      x₀, with c depending only on q₀ and K (Theorem B.1, after Orcan-Ekmekci).
    challenge: challenges/nondegeneracy
    challenge_theorems:
      - EllipticBernoulli.challenge_isLocalSmallestSuper_exists_le_of_closedBall_subset
      - EllipticBernoulli.challenge_exists_le_of_exteriorBall_sameRadius
      - EllipticBernoulli.challenge_nondegenerate_sup_iff_average
      - EllipticBernoulli.challenge_isDownwardMinimizer_exists_le_of_closedBall_subset
      - EllipticBernoulli.challenge_exists_pos_le_of_isLocalLargestSub
  - id: flatness-regularity
    kind: headline-theorem
    expected_axioms: [propext, Quot.sound, Classical.choice]
    title: Flat free boundaries are C^{1,γ} and classical
    source: "D. De Silva, Free boundary regularity for a problem with right hand side, Interfaces Free Bound. 13 (2011), no. 2, 223–238; arXiv:0912.2057, Theorem 1.1 (f = 0, g = Q; De Silva allows a Hölder g, here Q is Lipschitz)"
    module: EllipticBernoulli.Flatness.Classical
    declaration: EllipticBernoulli.isClassicalNear_of_flat
    related_declarations:
      - EllipticBernoulli.isC1GammaHypersurfaceNear_of_flat
    informal: >
      For Lipschitz Q bounded below, a viscosity solution which is two-sidedly
      ε̄r-flat with slope Q(x₀) in B_r(x₀) at a free boundary point has a
      C^{1,γ} free boundary in B_{r/2}(x₀), and is classical near x₀: the
      gradient extends continuously to the free boundary with |∇u| = Q there.
    challenge: challenges/flatness-regularity
    challenge_theorems:
      - EllipticBernoulli.challenge_isC1GammaHypersurfaceNear_of_flat
      - EllipticBernoulli.challenge_isClassicalNear_of_flat
  - id: classical-solutions
    kind: headline-theorem
    expected_axioms: [propext, Quot.sound, Classical.choice]
    title: Classical solutions
    source: "D. Kriventsov, G. S. Weiss, Rectifiability, finite Hausdorff measure, and compactness for non-minimizing Bernoulli free boundaries, Comm. Pure Appl. Math. 78 (2025), no. 3, 545–591; arXiv:2306.10131 (numbering of v2), Definition 9.1 and the remark after it (classical ⇒ variational), Proposition 9.1; H. W. Alt, L. A. Caffarelli, Existence and regularity for a minimum problem with free boundary, J. Reine Angew. Math. 325 (1981), 105–144, Thm 6.3 and Remark 6.4 (the modulus here may depend on the Lipschitz bound)"
    module: EllipticBernoulli.Classical.InnerVariation
    declaration: EllipticBernoulli.IsClassicalSolution.integral_innerVarIntegrand_eq_zero
    related_declarations:
      - EllipticBernoulli.IsClassicalSolution.isViscSolution
      - EllipticBernoulli.classical_lipschitz_bound
    informal: >
      Classical solutions (smooth free boundary, possibly with positivity on
      both sides) are viscosity solutions for continuous Q, and, for Q
      Lipschitz with Q ≥ c > 0, satisfy the inner-variation identity for
      compactly supported Lipschitz test fields; for Q ≡ 1 their gradient satisfies
      the Alt–Caffarelli bound sup_{B_r} |∇u| ≤ 1 + ω(r), with ω depending on
      the Lipschitz bound.
    challenge: challenges/classical-solutions
    challenge_theorems:
      - EllipticBernoulli.challenge_isClassicalSolution_isViscSolution
      - EllipticBernoulli.challenge_isClassicalSolution_integral_innerVarIntegrand_eq_zero
      - EllipticBernoulli.challenge_classical_lipschitz_bound
  - id: planar-classification
    kind: headline-theorem
    expected_axioms: [propext, Quot.sound, Classical.choice]
    title: Planar 1-homogeneous inner variational solutions
    source: "D. Jerison, N. Kamburov, Structure of one-phase free boundaries in the plane, Int. Math. Res. Not. IMRN 2016, no. 19, 5922–5987; arXiv:1412.4106, after §5 (the case analysis in the proof of Proposition 5.3; Propositions 5.3 and 5.4 assume in addition a Lipschitz, non-degenerate solution that is both viscosity and variational, χ = 1_{u>0}). The Lean theorem is a more general classification."
    module: EllipticBernoulli.Blowup.PlanarClassification
    declaration: EllipticBernoulli.classification_homogeneous_planar
    informal: >
      A 1-homogeneous inner variational solution of the one-phase problem with
      constant coefficient q > 0 on the plane is a half-plane solution, a
      two-plane solution with χ = 1 a.e., or trivial with χ = 0 a.e.
    challenge: challenges/planar-classification
    challenge_theorems:
      - EllipticBernoulli.challenge_classification_homogeneous_planar

comparator:
  smoke_test:
    lean_file: "EllipticBernoulli/Comparator.lean"
    lake_target: "EllipticBernoulliComparator"
    purpose: >-
      API-regression smoke tests: each headline statement of EllipticBernoulli/Statements/* is
      restated and discharged by the library theorem that proves it. It imports the library, so
      it certifies nothing on its own and is not a substitute for the external comparator
      challenges.
  external_challenges:
    directory: "challenges"
    purpose: >-
      Standalone comparator challenge workspaces, one per target above (its challenge and
      challenge_theorems fields). In each, Challenge/*.lean restates the library vocabulary over
      Mathlib only, Challenge.lean states the claims with `sorry`, and Solution.lean imports
      EllipticBernoulli and proves the same statements.
    release_workflow: ".github/workflows/release-comparator.yml"
    comparator_revision: "575674928e239f5bc452aab72d1dd7b0f1326494"
    lean4export_revision: "076e8e57707e813375e8f9da8bf989799ace9680"
    landrun_revision: "811cfff51ceaf3d9843708aa6d22e9b84ccac8b4"
    toolchain: "leanprover/lean4:v4.34.1"
    mathlib: "v4.34.1"
    permitted_axioms:
      - "propext"
      - "Classical.choice"
      - "Quot.sound"
